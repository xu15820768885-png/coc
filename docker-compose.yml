services:
  coc-reminder:
    image: ghcr.mirrorify.net/xu15820768885-png/coc:latest
    container_name: coc-reminder
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      PORT: "8080"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "change-this-admin-password"
      PUBLIC_BASE_URL: "https://coc.weige1999.xin"
    ports:
      - "802:8080"
    volumes:
      - /volume1/docker/coc/data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
